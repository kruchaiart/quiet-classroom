<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ห้องเรียนเงียบกริบ - Quiet Classroom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background-color: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 800px; background: #16213e; padding: 24px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); text-align: center; }
    
    .screen { display: none; }
    .screen.active { display: block; }
    h1 { margin-bottom: 20px; font-size: 26px; color: #4ecca3; }
    .settings { margin-bottom: 24px; background: #0f3460; padding: 16px; border-radius: 12px; text-align: left; }
    .setting-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; }
    input[type="number"], input[type="range"] { width: 100%; padding: 8px; border-radius: 8px; border: none; accent-color: #4ecca3; }
    
    .skins-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .skin-card { background: #0f3460; border: 2px solid #4ecca3; border-radius: 12px; padding: 12px; cursor: pointer; }
    .skin-card .placeholder { width: 100%; height: 120px; border-radius: 8px; background: #e94560; display: flex; justify-content: center; align-items: center; font-size: 40px; margin-bottom: 8px; }
    
    .timer-display { font-size: 64px; font-weight: bold; color: #e94560; margin-bottom: 8px; letter-spacing: 2px; }
    .video-container { position: relative; width: 100%; height: 350px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .fallback-card { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; font-size: 20px; background: #222; }
    
    /* กล่องแผงควบคุมเสียงในหน้าเล่นเกม */
    .live-tuning-panel { background: #0f3460; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .tuning-item label { font-size: 12px; color: #a5b1c2; display: flex; justify-content: space-between; }
    
    .meter-container { width: 100%; height: 16px; background: #333; border-radius: 8px; overflow: hidden; margin-bottom: 16px; position: relative; }
    .meter-bar { width: 0%; height: 100%; background: #4ecca3; transition: width 0.05s ease; }
    .meter-bar.warning { background: #f39c12; }
    .meter-bar.danger { background: #e74c3c; }
    .threshold-marker { position: absolute; top: 0; bottom: 0; width: 3px; background: #e74c3c; z-index: 2; }

    .btn { background: #4ecca3; color: #1a1a2e; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn:hover { background: #38b58b; }
    .btn-danger { background: #e94560; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <!-- หน้าแรก (Home) -->
  <div id="home-screen" class="screen active">
    <h1>ระบบควบคุมเสียงห้องเรียน</h1>
    
    <div class="settings">
      <div class="setting-group">
        <label>เวลาที่ต้องการนับถอยหลัง (นาที):</label>
        <input type="number" id="time-input" value="10" min="1" max="120">
      </div>
    </div>

    <h3>สกินปัจจุบัน:</h3>
    <div class="skins-grid">
      <div class="skin-card">
        <div class="placeholder">🐰🐺</div>
        <strong>กระต่ายหนีหมาป่า</strong>
      </div>
    </div>

    <button class="btn" onclick="startGame()">เริ่มจับเวลา</button>
  </div>

  <!-- หน้าเล่นเกม (Game Screen) -->
  <div id="game-screen" class="screen">
    <div class="timer-display" id="timer">10:00</div>
    
    <div class="video-container">
      <video id="game-video" autoplay loop muted playsinline></video>
      <div id="fallback-view" class="fallback-card">
        <div id="status-emoji" style="font-size: 60px;">🐰</div>
        <div id="status-text" style="margin-top: 10px;">ระดับปกติ: กระต่ายหลบหลังพุ่มไม้</div>
      </div>
    </div>

    <!-- แผงปรับระดับเสียงสดระหว่างเล่นเกม -->
    <div class="live-tuning-panel">
      <div class="tuning-item">
        <label>
          <span>ความกว้างห้อง/ขยายเสียง (Gain):</span>
          <span id="gain-val">1.0x</span>
        </label>
        <input type="range" id="gain-slider" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="tuning-item">
        <label>
          <span>เกณฑ์ความเงียบ (Threshold):</span>
          <span id="thresh-val">40</span>
        </label>
        <input type="range" id="threshold-slider" min="10" max="90" value="40">
      </div>
    </div>

    <!-- หลอดเดซิเบล พร้อมเส้นขีดแดงบอกระดับเป้าหมาย -->
    <div class="meter-container">
      <div id="thresh-line" class="threshold-marker" style="left: 40%;"></div>
      <div id="meter-fill" class="meter-bar"></div>
    </div>

    <div>
      <button class="btn btn-danger" onclick="stopGame()">หยุดและกลับหน้าแรก</button>
    </div>
  </div>
</div>

<script>
  const SKINS = {
    rabbit: {
      name: "กระต่ายหนีหมาป่า",
      videos: {
        normal: "videos/rabbit_normal.mp4",
        warning: "videos/rabbit_warning.mp4",
        danger: "videos/rabbit_danger.mp4"
      }
    }
  };

  let selectedSkin = 'rabbit';
  let audioContext, analyser, microphone, javascriptNode, gainNode;
  let timerInterval;
  let remainingSeconds = 600;
  let isGameOver = false;

  async function startGame() {
    const mins = parseInt(document.getElementById('time-input').value) || 10;
    remainingSeconds = mins * 60;
    isGameOver = false;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      setupAudio(stream);
    } catch (err) {
      alert("กรุณากดยินยอมให้เบราว์เซอร์เข้าถึงไมโครโฟน");
      return;
    }

    document.getElementById('home-screen').classList.remove('active');
    document.getElementById('game-screen').classList.add('active');

    updateTimerDisplay();
    startTimer();
    setGameState('normal');
  }

  function setupAudio(stream) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    microphone = audioContext.createMediaStreamSource(stream);
    gainNode = audioContext.createGain(); // โหนดเร่ง/ลดความไวไมค์
    javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

    analyser.smoothingTimeConstant = 0.8;
    analyser.fftSize = 1024;

    // เชื่อมต่อ: ไมค์ -> ปรับ Gain -> วิเคราะห์ความถี่ -> ประมวลผล
    microphone.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(javascriptNode);
    javascriptNode.connect(audioContext.destination);

    javascriptNode.onaudioprocess = function() {
      if (isGameOver) return;

      const array = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(array);
      let values = 0;
      for (let i = 0; i < array.length; i++) {
        values += array[i];
      }
      const average = values / array.length;
      handleNoiseLevel(average);
    };
  }

  function handleNoiseLevel(volume) {
    const threshold = parseInt(document.getElementById('threshold-slider').value) || 40;
    const meter = document.getElementById('meter-fill');
    
    // แสดงผลแถบเสียง
    const widthVal = Math.min(volume * 2, 100);
    meter.style.width = widthVal + '%';

    if (widthVal < threshold) {
      meter.className = 'meter-bar';
      setGameState('normal');
    } else if (widthVal >= threshold && widthVal < threshold + 20) {
      meter.className = 'meter-bar warning';
      setGameState('warning');
    } else {
      meter.className = 'meter-bar danger';
      setGameState('danger');
    }
  }

  let currentState = '';
  function setGameState(state) {
    if (currentState === state || isGameOver) return;
    currentState = state;

    const videoEl = document.getElementById('game-video');
    const statusText = document.getElementById('status-text');
    const statusEmoji = document.getElementById('status-emoji');
    const skin = SKINS[selectedSkin];

    if (state === 'normal') {
      videoEl.src = skin.videos.normal;
      statusEmoji.textContent = '🐰';
      statusText.textContent = 'ระดับปกติ: กระต่ายหลบหลังพุ่มไม้';
    } else if (state === 'warning') {
      videoEl.src = skin.videos.warning;
      statusEmoji.textContent = '⚠️';
      statusText.textContent = 'ระดับซวยแล้ว: หมาป่าเริ่มหันมามอง!';
    } else if (state === 'danger') {
      videoEl.src = skin.videos.danger;
      statusEmoji.textContent = '🐺💥';
      statusText.textContent = 'ระดับบรรลัย: หมาป่าตะปบแล้ว! หยุดเวลา!';
      triggerGameOver();
    }
    videoEl.play().catch(() => {});
  }

  function triggerGameOver() {
    isGameOver = true;
    clearInterval(timerInterval);
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateTimerDisplay();

      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        alert("หมดเวลา! ห้องเรียนเงียบสงบสำเร็จ!");
        stopGame();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.floor(remainingSeconds / 60);
    const s = remainingSeconds % 60;
    document.getElementById('timer').textContent = 
      `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function stopGame() {
    clearInterval(timerInterval);
    if (audioContext) audioContext.close();
    document.getElementById('game-screen').classList.remove('active');
    document.getElementById('home-screen').classList.add('active');
    currentState = '';
  }

  // อัปเดตค่า Gain (ความไวไมค์) แบบสดๆ
  document.getElementById('gain-slider').addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    document.getElementById('gain-val').textContent = val.toFixed(1) + 'x';
    if (gainNode) {
      gainNode.gain.value = val;
    }
  });

  // อัปเดตเส้นขีด Threshold สีแดงแบบสดๆ
  document.getElementById('threshold-slider').addEventListener('input', (e) => {
    const val = e.target.value;
    document.getElementById('thresh-val').textContent = val;
    document.getElementById('thresh-line').style.left = val + '%';
  });
</script>
</body>
</html>
